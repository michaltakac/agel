name: Agel conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install bootstrap and VM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl binutils clang \
            qemu-system-x86 qemu-system-arm qemu-system-misc
      - name: Add freestanding targets
        run: |
          rustup target add x86_64-unknown-none
          rustup target add aarch64-unknown-none-softfloat
          rustup target add riscv64imac-unknown-none-elf
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path boot/kernel/Cargo.toml -- --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps
      - run: ./scripts/test-bootstrap.sh
      - run: ./scripts/test-fixed-point.sh
      - run: ./scripts/test-kitchensink.sh
      - run: ./scripts/test-kernel-contract.sh
      - run: ./scripts/test-boot.sh
      - run: ./scripts/test-monitor.sh
      - run: ./scripts/test-native.sh
      - run: sh ./scripts/test-native-agents.sh
      - run: ./scripts/test-native-repl.sh
      - run: ./scripts/test-native-persistence.sh
      - run: ./scripts/test-graphics.sh
      - run: ./scripts/test-live-desktop.sh
      - run: ./scripts/test-graphical-workshop.sh
      - run: ./scripts/test-live-keyboard.sh
      - run: python3 scripts/test-graphical-console.py target/boot/agel-v1.img
      - run: ./scripts/test-isolation.sh
      - run: cargo clippy --manifest-path boot/kernel/Cargo.toml --target x86_64-unknown-none -- -D warnings
      - run: cargo clippy --manifest-path boot/kernel/Cargo.toml --target x86_64-unknown-none --features selftest -- -D warnings
      - run: cargo clippy --manifest-path boot/kernel/Cargo.toml --target x86_64-unknown-none --features monitor-selftest -- -D warnings
      - run: cargo clippy --manifest-path boot/kernel/Cargo.toml --target x86_64-unknown-none --features native-selftest -- -D warnings
      - run: cargo clippy --manifest-path boot/kernel/Cargo.toml --target x86_64-unknown-none --features isolation-selftest -- -D warnings
      - run: cargo clippy --manifest-path boot/kernel/Cargo.toml --target x86_64-unknown-none --features isolated-repl -- -D warnings
      - run: cargo clippy --manifest-path boot/kernel/Cargo.toml --target x86_64-unknown-none --features graphics-selftest -- -D warnings
      - run: cargo clippy --manifest-path boot/kernel/Cargo.toml --target aarch64-unknown-none-softfloat --features isolation-selftest -- -D warnings
      - run: cargo clippy --manifest-path boot/kernel/Cargo.toml --target riscv64imac-unknown-none-elf --features isolation-selftest -- -D warnings

  sel4:
    # The assurance backend: the same contract on an unmodified seL4 kernel.
    # It is a separate job because it downloads a 66 MiB SDK and boots a 2 GiB
    # machine, and because a failure here means something different from a
    # failure above: the research backends are ours, this one is not.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-unknown-none-softfloat
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-arm
      - name: Cache the Microkit SDK
        uses: actions/cache@v4
        with:
          path: target/sel4/microkit-sdk-2.3.0
          key: microkit-sdk-2.3.0-linux-x86-64
      - run: cargo fmt --manifest-path boot/microkit/Cargo.toml -- --check
      - run: cargo clippy --manifest-path boot/microkit/Cargo.toml --target aarch64-unknown-none-softfloat --release --lib --bins -- -D warnings
      - run: ./scripts/test-sel4.sh
      - name: The manifest must describe the kernel that was actually booted
        run: |
          ./scripts/sel4-manifest.sh > /tmp/sel4-manifest.md
          # Only the trusted base and the kernel configuration are checked. The
          # protection-domain hashes depend on the compiler that built them, so
          # requiring those to match would only assert that CI and a developer
          # run the same rustc.
          for section in '## Trusted base' '## Kernel configuration'; do
            awk -v s="$section" '$0==s{f=1} f&&/^$/&&n++>1{exit} f' \
              docs/sel4-manifest.md > /tmp/expected.md
            awk -v s="$section" '$0==s{f=1} f&&/^$/&&n++>1{exit} f' \
              /tmp/sel4-manifest.md > /tmp/actual.md
            diff -u /tmp/expected.md /tmp/actual.md
          done
