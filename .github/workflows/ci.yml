name: Agel conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install bootstrap and VM tools
        run: sudo apt-get update && sudo apt-get install -y sbcl qemu-system-x86 binutils clang
      - run: rustup target add x86_64-unknown-none
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path boot/kernel/Cargo.toml -- --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps
      - run: ./scripts/test-bootstrap.sh
      - run: ./scripts/test-boot.sh
      - run: ./scripts/test-monitor.sh
      - run: cargo clippy --manifest-path boot/kernel/Cargo.toml --target x86_64-unknown-none -- -D warnings
      - run: cargo clippy --manifest-path boot/kernel/Cargo.toml --target x86_64-unknown-none --features selftest -- -D warnings
      - run: cargo clippy --manifest-path boot/kernel/Cargo.toml --target x86_64-unknown-none --features monitor-selftest -- -D warnings
