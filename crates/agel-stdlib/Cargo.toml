[package]
name = "agel-stdlib"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["std"]
# Without `std` the crate is `no_std`, as the runtime it installs into is:
# the library is Agel source and the installer is one call.
std = ["agel-core/std"]

[dependencies]
agel-core = { path = "../agel-core", default-features = false }

[dev-dependencies]
agel-model = { path = "../agel-model" }
serde_json = "1"

[lints]
workspace = true
