# x86-64 remains the default so the BIOS workshop scripts need no target flag.
# The other two architectures are selected explicitly by
# `./scripts/build-kernel.sh <arch>`.
[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
rustflags = [
  "-C", "code-model=kernel",
  "-C", "relocation-model=static",
  "-C", "link-arg=-Tlinker/x86_64.ld",
  "-C", "target-feature=-sse,-sse2",
]

[target.aarch64-unknown-none-softfloat]
rustflags = [
  "-C", "relocation-model=static",
  "-C", "link-arg=-Tlinker/aarch64.ld",
]

[target.riscv64imac-unknown-none-elf]
rustflags = [
  "-C", "relocation-model=static",
  "-C", "link-arg=-Tlinker/riscv64.ld",
]
