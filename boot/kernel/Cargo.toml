[package]
name = "agel-boot"
version = "0.1.7"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
# Without the crate's `memory` feature the workshop images stay inside the
# 254-sector budget; the isolation build turns it on with `contract-memory`.
agel-kernel-abi = { path = "../../crates/agel-kernel-abi", default-features = false }
agel-integrity = { path = "../../crates/agel-integrity", default-features = false }

[features]
selftest = []
monitor-selftest = []
native-selftest = []
isolation-selftest = []
contract-memory = ["agel-kernel-abi/memory"]
# Loadable processes: the serial workshop can load a static ELF from the
# disk's program region into a fresh domain. The graphics image does not
# carry it; its 254-sector budget is spent.
process = []
isolated-repl = ["isolation-selftest", "process"]
native-graphics = ["isolation-selftest"]
graphics-selftest = ["native-graphics"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = false

[workspace]
