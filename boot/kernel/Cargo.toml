[package]
name = "agel-boot"
version = "0.1.7"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
# Without the crate's `memory` feature the workshop images stay inside the
# 254-sector budget; the isolation build turns it on with `contract-memory`.
agel-kernel-abi = { path = "../../crates/agel-kernel-abi", default-features = false }
agel-integrity = { path = "../../crates/agel-integrity", default-features = false }

[features]
selftest = []
monitor-selftest = []
native-selftest = []
isolation-selftest = []
contract-memory = ["agel-kernel-abi/memory"]
# Extra pages mapped into a domain after it is built: a loaded process's
# image, the compositor's font and icon assets.
pages = []
# Loadable processes: a workshop can load a static ELF from the disk's
# program region into a fresh domain, with the filesystem service beneath it.
process = ["pages"]
isolated-repl = ["isolation-selftest", "process"]
native-graphics = ["isolation-selftest", "pages", "process"]
graphics-selftest = ["native-graphics"]
# The AArch64 kernel laid out for the Raspberry Pi 4 (BCM2711), which QEMU
# models: a flat image at 0x80000, RAM from zero, entry at EL2, no virtio.
board-raspi4 = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = false

[workspace]
